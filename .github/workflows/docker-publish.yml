name: Publish Docker Images (GHCR)

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

jobs:
  build-and-push:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push Web Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/zerotrace-web:latest

      - name: Build & Push Orchestrator Image
        uses: docker/build-push-action@v5
        with:
          context: services/orchestrator
          file: services/orchestrator/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/zerotrace-orchestrator:latest

      - name: Build & Push Data Plane Image
        uses: docker/build-push-action@v5
        with:
          context: services/data-plane
          file: services/data-plane/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/zerotrace-dataplane:latest
