global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "zerotrace-orchestrator"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["orchestrator:8001"]

  - job_name: "zerotrace-data-plane"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["data-plane:8002"]
