# ZeroTrace Enterprise Docker Compose Architecture

networks:
  zt-net:
    name: zt-net
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ztpassword123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - zt-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zt-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: scality/s3server:latest
    container_name: zt-minio
    restart: unless-stopped
    environment:
      SCALITY_ACCESS_KEY_ID: minioadmin
      SCALITY_SECRET_ACCESS_KEY: minioadminpassword
    ports:
      - "9000:8000"
    volumes:
      - minio_data:/usr/src/app/localData
    networks:
      - zt-net

  iceberg-catalog:
    image: tabulario/iceberg-rest:latest
    container_name: zt-iceberg-catalog
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://kaveri-lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3__ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      AWS_REGION: ap-south-1
    depends_on:
      - minio
    networks:
      - zt-net

  orchestrator:
    build:
      context: ../services/orchestrator
      dockerfile: Dockerfile
    container_name: zt-orchestrator
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      ZT_ENV: development
      ZT_PORT: 8001
      ZT_DATABASE_URL: postgresql+asyncpg://postgres:ztpassword123@postgres:5432/zt_app
      ZT_REDIS_URL: redis://redis:6379/1
      ZT_DATAPLANE_URL: http://data-plane:8002
      ZT_SERVICE_KEY: dev-service-key
      ZT_ENABLE_OFFLINE_FALLBACK: "true"
      ZT_ANCHOR_PROVIDER: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zt-net

  # Data plane service container
  data-plane:
    build:
      context: ../services/data-plane
      dockerfile: Dockerfile
    container_name: zt-data-plane
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      ZT_ENV: production
      ZT_DATA_PLANE_PORT: 8002
      ZT_POSTGRES_URL: postgresql://postgres:ztpassword123@postgres:5432/zt_rag
      ZT_REDIS_URL: redis://redis:6379/0
      ZT_S3_ENDPOINT: http://minio:9000
      ZT_S3_BUCKET: kaveri-lakehouse
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      AWS_REGION: ap-south-1
      ZT_SERVICE_KEY: dev-service-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - zt-net

  # Web Frontend (React / Vite / Nginx)
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: zt-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - orchestrator
      - data-plane
    networks:
      - zt-net

