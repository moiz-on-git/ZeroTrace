apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dataplane
  labels:
    app.kubernetes.io/name: zerotrace-dataplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: data-plane
spec:
  replicas: {{ .Values.dataPlane.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zerotrace-dataplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zerotrace-dataplane
        app.kubernetes.io/component: data-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: dataplane
          image: "{{ .Values.dataPlane.image.repository }}:{{ .Values.dataPlane.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.dataPlane.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dataPlane.resources | nindent 12 }}
          env:
            - name: ZT_ENV
              value: {{ .Values.global.environment | quote }}
            - name: ZT_DATA_PLANE_PORT
              value: "8002"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dataplane
  labels:
    app.kubernetes.io/name: zerotrace-dataplane
spec:
  type: {{ .Values.dataPlane.service.type }}
  ports:
    - port: {{ .Values.dataPlane.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: zerotrace-dataplane
