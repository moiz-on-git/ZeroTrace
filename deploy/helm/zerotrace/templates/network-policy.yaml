{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-data-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: data-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the Orchestrator (Brain Plane) may communicate with the Data Plane
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: brain-plane
      ports:
        - protocol: TCP
          port: 8002
  egress:
    # Data plane may only egress to Postgres, Redis, and MinIO lakehouse inside the cluster
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: lakehouse
{{- end }}
