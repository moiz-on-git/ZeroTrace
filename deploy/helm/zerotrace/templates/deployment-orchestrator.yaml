apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-orchestrator
  labels:
    app.kubernetes.io/name: zerotrace-orchestrator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: brain-plane
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zerotrace-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zerotrace-orchestrator
        app.kubernetes.io/component: brain-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: orchestrator
          image: "{{ .Values.orchestrator.image.repository }}:{{ .Values.orchestrator.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.orchestrator.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          env:
            - name: ZT_ENV
              value: {{ .Values.orchestrator.env.ZT_ENV | quote }}
            - name: ZT_PORT
              value: {{ .Values.orchestrator.env.ZT_PORT | quote }}
            - name: ZT_ANCHOR_PROVIDER
              value: {{ .Values.orchestrator.env.ZT_ANCHOR_PROVIDER | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-orchestrator
  labels:
    app.kubernetes.io/name: zerotrace-orchestrator
spec:
  type: {{ .Values.orchestrator.service.type }}
  ports:
    - port: {{ .Values.orchestrator.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: zerotrace-orchestrator
